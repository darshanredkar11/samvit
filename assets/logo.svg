<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Samvit logo">
  <title>Samvit</title>

  <!-- Background -->
  <rect width="320" height="320" fill="#16161e" rx="24"/>

  <defs>
    <!-- Core glow -->
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#7aa2f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4a7ae0" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="core-glow" x="-60%" y="-60%" width="320%" height="320%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="node-glow" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Hub-and-spoke: 5 agents orbiting a shared core ─────────────── -->
  <!-- Center: (160, 148)   Pentagon radius: 82px                        -->
  <!-- Angles (from top, clockwise): 90°,18°,306°,234°,162°             -->
  <!--   top      : (160, 66)                                            -->
  <!--   top-right: (238, 122)                                           -->
  <!--   bot-right: (208, 214)                                           -->
  <!--   bot-left : (112, 214)                                           -->
  <!--   top-left : (82, 122)                                            -->

  <!-- Spoke lines (drawn first, under everything) -->
  <line x1="160" y1="66"  x2="160" y2="131" stroke="#bb9af7" stroke-width="1.2" opacity="0.55"/>
  <line x1="238" y1="122" x2="177" y2="143" stroke="#bb9af7" stroke-width="1.2" opacity="0.55"/>
  <line x1="208" y1="214" x2="170" y2="162" stroke="#bb9af7" stroke-width="1.2" opacity="0.55"/>
  <line x1="112" y1="214" x2="150" y2="162" stroke="#bb9af7" stroke-width="1.2" opacity="0.55"/>
  <line x1="82"  y1="122" x2="143" y2="143" stroke="#bb9af7" stroke-width="1.2" opacity="0.55"/>

  <!-- Faint pentagon outline connecting agents -->
  <polygon
    points="160,66 238,122 208,214 112,214 82,122"
    fill="none" stroke="#bb9af7" stroke-width="0.7" opacity="0.18"
    stroke-dasharray="3 5"/>

  <!-- Central core -->
  <circle cx="160" cy="148" r="22" fill="url(#core-grad)" filter="url(#core-glow)"/>
  <circle cx="160" cy="148" r="22" fill="#7aa2f7"/>
  <!-- Core inner ring -->
  <circle cx="160" cy="148" r="11" fill="none" stroke="#1f2335" stroke-width="2.5"/>
  <!-- Core center dot -->
  <circle cx="160" cy="148" r="4"  fill="#c0caf5" opacity="0.9"/>

  <!-- Agent nodes -->
  <circle cx="160" cy="66"  r="10" fill="#7aa2f7" opacity="0.82" filter="url(#node-glow)"/>
  <circle cx="238" cy="122" r="10" fill="#7aa2f7" opacity="0.82" filter="url(#node-glow)"/>
  <circle cx="208" cy="214" r="10" fill="#7aa2f7" opacity="0.82" filter="url(#node-glow)"/>
  <circle cx="112" cy="214" r="10" fill="#7aa2f7" opacity="0.82" filter="url(#node-glow)"/>
  <circle cx="82"  cy="122" r="10" fill="#7aa2f7" opacity="0.82" filter="url(#node-glow)"/>

  <!-- Inner dots on agents -->
  <circle cx="160" cy="66"  r="3" fill="#1f2335"/>
  <circle cx="238" cy="122" r="3" fill="#1f2335"/>
  <circle cx="208" cy="214" r="3" fill="#1f2335"/>
  <circle cx="112" cy="214" r="3" fill="#1f2335"/>
  <circle cx="82"  cy="122" r="3" fill="#1f2335"/>

  <!-- Label -->
  <text x="160" y="290"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="19" font-weight="500" fill="#c0caf5"
        text-anchor="middle" letter-spacing="4">samvit</text>
</svg>
