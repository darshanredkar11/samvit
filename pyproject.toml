[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samvit"
version = "0.1.0"
description = "Provider-agnostic multi-agent coordination layer"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "mcp[cli]>=1.3",
    "sentence-transformers>=3.0",
    "aiokafka>=0.11",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["samvit"]
