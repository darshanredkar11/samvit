[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samvit"
version = "0.2.0"
description = "Shared coordination server for Claude, Codex, Antigravity, and other AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Darshan Redkar" },
]
keywords = ["ai-agents", "mcp", "multi-agent", "claude-code", "coordination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.29,<0.30",
    "asyncpg>=0.29,<0.30",
    "mcp[cli]>=1.10,<2",
    "fastembed>=0.4,<0.5",
    "aiokafka>=0.11,<0.12",
    "bcrypt>=4.1,<4.2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://darshanredkar11.github.io/samvit/"
Repository = "https://github.com/darshanredkar11/samvit"
Documentation = "https://github.com/darshanredkar11/samvit/blob/main/docs/USAGE.md"
Issues = "https://github.com/darshanredkar11/samvit/issues"

[project.scripts]
samvit = "samvit.cli:main"

[project.optional-dependencies]
headroom = [
    "headroom-ai>=0.1,<0.2",
]
pdf = [
    "pdfplumber>=0.11,<0.12",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.28",
    "pytest-cov>=5.0,<6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["samvit"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "samvit/migrations"
